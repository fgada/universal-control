<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Universal Control Mic</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 14px 16px; min-width: 300px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; }
    input[type="text"], input[type="number"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 4px 6px; }
    .row { display: flex; gap: 8px; }
    .row > div:first-child { flex: 1; }
    .row > div:last-child { width: 80px; }
    fieldset { border: none; padding: 0; margin: 10px 0 0; }
    fieldset label { font-weight: normal; margin: 2px 0; }
    .hint { font-size: 12px; opacity: 0.7; margin: 2px 0 0 20px; }
    #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: color-mix(in srgb, currentColor 8%, transparent); }
    #status.ok { background: color-mix(in srgb, #1a7f37 18%, transparent); }
    #status.error { background: color-mix(in srgb, #cf222e 18%, transparent); }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Universal Control Mic</h1>

  <div class="row">
    <div>
      <label for="host">sender のアドレス</label>
      <input id="host" type="text" placeholder="192.168.1.10" autocomplete="off">
    </div>
    <div>
      <label for="port">ポート</label>
      <input id="port" type="number" min="1" max="65535">
    </div>
  </div>

  <label for="token">トークン（sender の --audio-token）</label>
  <input id="token" type="password" autocomplete="off">

  <fieldset>
    <label><input type="radio" name="mode" value="device"> 仮想マイクとして追加</label>
    <div class="hint">会議アプリのマイク選択で「Universal Control Mic」を選びます。</div>
    <label><input type="radio" name="mode" value="replace"> すべてのマイクを置き換える</label>
    <div class="hint">マイク選択ができないアプリ向け。設定後にページを再読み込みしてください。</div>
  </fieldset>

  <div id="status">状態を取得中…</div>
  <button id="test" type="button">接続テスト</button>

  <script src="popup.js"></script>
</body>
</html>
